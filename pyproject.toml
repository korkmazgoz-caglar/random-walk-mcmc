[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rwmcmc"
version = "0.2.0"
description = "Lightweight Random-Walk Metropolis-Hastings sampler with diagnostics and visualization"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Enes Çağlar Korkmazgöz", email = "caglar.korkmazgoez@rwth-aachen.de" }]
license = { text = "MIT" }
keywords = ["mcmc", "metropolis-hastings", "bayesian", "sampling", "diagnostics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
notebooks = ["jupyter>=1.0", "ipykernel>=6.29", "seaborn>=0.13", "scipy>=1.11"]
dev = ["pytest>=8.0", "ruff==0.16.*", "scipy>=1.11"]

[project.scripts]
rwmcmc-run = "rwmcmc.cli:main"

[project.urls]
Repository = "https://github.com/korkmazgoz-caglar/random-walk-mcmc"

[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
line-length = 100
extend-exclude = ["tutorials", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
