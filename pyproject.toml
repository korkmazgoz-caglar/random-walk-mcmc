[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rwmcmc"
version = "0.1.1"
description = "Lightweight Random-Walk Metropolis-Hastings sampler with diagnostics and visualization"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Çağlar Korkmazgöz", email = "caglar.korkmazgoez@rwth-aachen.de" }]
license = { text = "MIT" }
keywords = ["mcmc", "metropolis-hastings", "bayesian", "sampling", "diagnostics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
notebooks = ["jupyter>=1.0", "ipykernel>=6.29", "seaborn>=0.13"]
dev = ["pytest>=8.0"]

[project.scripts]
rwmcmc-run = "rwmcmc.cli:main"

[project.urls]
Repository = "https://github.com/korkmazgoz-caglar/random-walk-mcmc"

[tool.setuptools.packages.find]
where = ["src"]